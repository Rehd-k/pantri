name: pantri
description: "Pantri — Flutter client for the Pantra payroll-deduction marketplace."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  dio: ^5.8.0
  auto_route: ^10.1.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.4
  share_plus: ^10.1.4
  image_picker: ^1.2.2
  http: ^1.6.0
  app_links: ^6.4.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  auto_route_generator: ^10.1.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
